<!DOCTYPE html>
<html>
<head>

<style>

.zoom-image {
    width: 500px;
    animation: zoomEffect 5s infinite;
}

@keyframes zoomEffect {
    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.2);
    }

    100% {
        transform: scale(1);
    }
}

</style>

</head>

<body>

<h1>My Zoom Effect</h1>

<img class="zoom-image" src="Snorlax.jpg">

</body>
</html>
