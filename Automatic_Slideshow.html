<!DOCTYPE html>
<html>
<head>
    <style>
        #slideshow {
            margin: 50px auto;
            position: relative;
            width: 240px;
            height: 240px;
            padding: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
        }

        #slideshow > div {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
        }
    </style>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    
</head>

<body>
    <div id="slideshow">

        <div>
            <img src="Snorlax.jpg" alt="Image 1">
        </div>
        <div>
            <img src="Snorlax2.jpg" alt="Image 2">
        </div>
        <div>
            <img src="Snorlax3.jpg" alt="Image 3">
        </div>
        <div>
            <img src="pikachoo.jpg" alt="Image 4">
        </div>
        <div>
            <img src="pikachu2.jpg" alt="Image 5">
        </div>
        
    </div>

<!-- Our jQuery code-->

<script>

    $("#slideshow > div:gt(0)").hide();

    setInterval(function() {

        $('#slideshow > div:first')
            .fadeOut(1000)
            .next()
            .fadeIn(1000)
            .end()
            .appendTo('#slideshow');
    }, 3000);
</script>
</body>
