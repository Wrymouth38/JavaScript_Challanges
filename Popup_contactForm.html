<html>
<body>

<h2>Contact Details</h2>

<form name="contactForm" action="/action_page.php" onsubmit="return checkForm()" method="post">

  <label for="fullName">Your Name:</label><br>
  <input type="text" id="fullName" name="fullName"><br>

  <label for="phone">Phone:</label><br>
  <input type="text" id="phone" name="phone"><br><br>

  <input type="submit" value="Send Details">

</form>

<p>Click the button above to submit your contact information.</p>

<script>
    function checkForm() {
        let name = document.forms["contactForm"]["fullName"].value;

        if (name == "") {
            alert("Please enter your name before submitting.");
            return false;
        }
    }
</script>

</body>
</html>
