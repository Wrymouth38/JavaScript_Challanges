<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: Arial, Helvetica, sans-serif;
}

* {
  box-sizing: border-box;
}

/* Button used to open the sign-in form */
.open-button {
  background-color: #333;
  color: white;
  padding: 15px 20px;
  border: none;
  cursor: pointer;
  opacity: 0.85;
  position: fixed;
  bottom: 25px;
  right: 30px;
  width: 260px;
}

/* The popup form - hidden by default */
.form-popup {
  display: none;
  position: fixed;
  bottom: 0;
  right: 20px;
  border: 2px solid #ccc;
  z-index: 9;
}

/* Style the form container */
.form-container {
  max-width: 320px;
  padding: 15px;
  background-color: white;
}

/* Style the input fields */
.form-container input[type=text],
.form-container input[type=password] {
  width: 100%;
  padding: 14px;
  margin: 6px 0 20px 0;
  border: none;
  background: #f2f2f2;
}

/* Change input appearance when selected */
.form-container input[type=text]:focus,
.form-container input[type=password]:focus {
  background-color: #e6e6e6;
  outline: none;
}

/* Main sign-in button */
.form-container .btn {
  background-color: #0077b6;
  color: white;
  padding: 14px 20px;
  border: none;
  cursor: pointer;
  width: 100%;
  margin-bottom: 10px;
  opacity: 0.85;
}

/* Close button */
.form-container .cancel {
  background-color: #d62828;
}

/* Hover effect */
.form-container .btn:hover,
.open-button:hover {
  opacity: 1;
}
</style>
</head>

<body>

<h2>Member Sign-In</h2>

<p>Click the button below to open the sign-in form.</p>

<button class="open-button" onclick="showForm()">Sign In</button>

<div class="form-popup" id="loginForm">

  <form action="/action_page.php" class="form-container">

    <h1>Welcome Back</h1>

    <label for="email"><b>Email Address</b></label>
    <input type="text" placeholder="Enter your email" name="email" required>

    <label for="password"><b>Password</b></label>
    <input type="password" placeholder="Enter your password" name="password" required>

    <button type="submit" class="btn">Sign In</button>

    <button type="button" class="btn cancel" onclick="hideForm()">Close</button>

  </form>
</div>

<script>

function showForm() {
  document.getElementById("loginForm").style.display = "block";
}

function hideForm() {
  document.getElementById("loginForm").style.display = "none";
}

</script>

</body>
</html>
